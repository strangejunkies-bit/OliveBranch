<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Olive Branch · Authentic Middle Eastern in Ypsilanti, MI</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Dancing+Script:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

    <style>
        /* Main Theme Variables */
        :root {
            --brand: #8B6F47;
            --accent: #C6933A;
            --ink: #1D2226;
            --cream: #FAF7F2;
            --bg: #FDFCFA;
            --secondary: #F5F0E8;
            --border: #E2D9CC;
            --muted: #7A7167;
            --fg: #1D2226;
            --nav-h: 64px;
            --olive: #576b38;
        }

        /* Global Resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--fg);
            background: var(--bg);
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* Navigation Layout */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            height: var(--nav-h);
            background: rgba(29, 34, 38, 0.92);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .nav-logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            letter-spacing: .05em;
            display: flex;
            align-items: center;
        }

        .nav-logo-img {
            height: 38px;
            width: auto;
            display: block;
        }

        .nav-logo small {
            font-family: 'Dancing Script', cursive;
            font-size: .72rem;
            display: block;
            color: var(--accent);
            margin-bottom: 1px;
        }

        .nav-links {
            display: flex;
            gap: 0;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: rgba(255, 255, 255, .72);
            text-decoration: none;
            font-size: .6rem;
            font-weight: 600;
            letter-spacing: .2em;
            text-transform: uppercase;
            transition: color .2s;
            padding: .5rem .75rem;
            white-space: nowrap;
        }

        .nav-links a:hover, 
        .nav-links a.active {
            color: var(--accent);
        }

        .nav-cta {
            background: var(--olive) !important;
            color: #fff !important;
            padding: .5rem 1rem !important;
            border-radius: 3px;
            margin-left: .25rem;
        }

        .nav-cta:hover {
            opacity: .88;
        }

        .nav-mobile-only {
            display: none;
        }

        .nav-icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .78);
            padding: .4rem .55rem;
            cursor: pointer;
            transition: color .2s;
            min-height: 44px;
            min-width: 44px;
        }

        .nav-icon-btn:hover, 
        .nav-icon-btn.active {
            color: var(--accent);
        }

        .nav-icon-btn svg {
            display: block;
        }

        /* Hero Section Styling */
        .hero {
            position: relative;
            height: 100vh;
            min-height: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .hero-ken-burns {
            position: absolute;
            inset: -5%;
            background-image: url("images/hero.jpg");
            background-size: cover;
            background-position: center;
        }

        /* Responsive Breakpoints */
        @media(max-width: 479px) {
            .nav-links li.nav-text { display: none; }
            .nav-links li.nav-mobile-only { display: flex; }
            .nav-logo-img { height: 32px; }
            .nav-links { gap: .1rem; }
            .nav-cta { padding: .5rem .85rem !important; font-size: .58rem; }
        }

        @media(min-width: 480px) and (max-width: 767px) {
            .nav-links a { font-size: .58rem; padding: .5rem .6rem; letter-spacing: .15em; }
        }

        @media(min-width: 768px) {
            .nav-logo-img { height: 42px; }
        }

        /* Page System */
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img class="nav-logo-img" src="images/logo.png" alt="Olive Branch Logo">
            <div>
                <small>The</small>
                Olive Branch
            </div>
        </div>
        <ul class="nav-links">
            <li class="nav-text"><a class="active" href="#home">Home</a></li>
            <li class="nav-text"><a href="#menu">Menu</a></li>
            <li><a class="nav-cta" href="#order">Order Now</a></li>
        </ul>
    </nav>

    <div id="home" class="page active">
        <section class="hero">
            <div class="hero-bg">
                <div class="hero-ken-burns"></div>
            </div>
        </section>
    </div>

</body>
</html>
